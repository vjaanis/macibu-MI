<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vienkārša Hello World mājaslapa">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, .28), transparent 32rem),
        radial-gradient(circle at 80% 75%, rgba(168, 85, 247, .26), transparent 30rem),
        #09090b;
    }

    main {
      width: min(90vw, 46rem);
      padding: clamp(2rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 2rem;
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, .35);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #7dd3fc;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 7rem);
      line-height: .95;
      letter-spacing: -.07em;
      background: linear-gradient(135deg, #fff 25%, #7dd3fc 60%, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p:last-child {
      margin: 1.5rem 0 0;
      color: #cbd5e1;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Mana pirmā mājaslapa</p>
    <h1>Hello,<br>World!</h1>
    <p>Lapa veiksmīgi un droši darbojas ar HTTPS.</p>
  </main>
</body>
</html>
